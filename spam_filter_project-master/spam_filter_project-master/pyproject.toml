[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spam-filter-project"
version = "0.1.0"
description = "Enterprise spam mail filtering course project with reproducible ML pipeline and Streamlit prototype."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "ML Project Team" }
]
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
